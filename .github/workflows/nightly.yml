name: Nightly dependency check

on:
  schedule:
    - cron: "0 11 * * *" # Daily at 11 AM UTC (3 AM PST)
  workflow_dispatch: # Allow manual triggers for testing

permissions:
  contents: read

jobs:
  test-latest-deps:
    if: github.event_name != 'schedule' || github.repository == 'google-deepmind/mujoco_warp'
    name: Test with latest dependencies (including pre-releases)
    # Early warning: tests against latest upstream versions to catch breaking changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [main, deepmind]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.branch }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.27"
          python-version: ${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install
      - name: Update dependencies to latest (including pre-releases)
        if: matrix.branch == 'main'
        run: |
          uv lock --upgrade
      - name: Update mujoco to latest dev version
        if: matrix.branch == 'deepmind'
        run: |
          uv lock --upgrade-package mujoco-core --upgrade-package mujoco-studio
      - name: Show updated dependency tree
        run: |
          uv tree
      - name: Test with pytest
        run: |
          uv run --with pytest --with pytest-xdist pytest -n 2

  benchmarks:
    if: github.event_name != 'schedule' || github.repository == 'google-deepmind/mujoco_warp'
    name: Run benchmark suite and verify zero overflows (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.27"
          python-version: "3.11"
      - name: Set up Python
        run: uv python install
      - name: Restore Warp kernel cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/warp
          key: warp-benchmarks-${{ runner.os }}-${{ runner.arch }}-3.11-${{ hashFiles('uv.lock', 'mujoco_warp/**/*.py') }}
          restore-keys: |
            warp-benchmarks-${{ runner.os }}-${{ runner.arch }}-3.11-
      - name: Run benchmark suite
        run: |
          uv run python3 benchmarks/run.py --nworld=1 --clear_warp_cache=false
