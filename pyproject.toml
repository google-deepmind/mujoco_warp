[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name="mujoco-warp"
version = "3.8.1"
# TODO(team): create a distribution list
authors = [
    {name = "Newton Developers", email = "mujoco@deepmind.com"},
]
description = "MuJoCo Warp (MJWarp)"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
# NOTE: `warp-lang` is intentionally not listed as a dependency. On AMD/ROCm,
# MJWarp runs against the ROCm fork of Warp (https://github.com/ROCm/warp),
# which must be built and installed from source (the PyPI `warp-lang` wheels are
# NVIDIA/CUDA-only). See the "Running on AMD / ROCm" section of the README for
# build instructions. Installing MJWarp will not pull or overwrite your
# source-built Warp.
dependencies = [
    "absl-py",
    "etils[epath]",
    "mujoco>=3.8.0",
    "numpy",
]

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
mujoco = {index = "mujoco"}

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-xdist",
    "ruff",
    "pygls>=1.0.0,<2.0.0",
    "lsprotocol>=2023.0.1,<2024.0.0",
    "mujoco>=3.8.0.dev0",
    "mjviser>=0.0.10",
    "pillow",
]
# TODO(team): cpu and rocm JAX optional dependencies are temporary, remove after we land MJX:Warp
cpu = [
    "jax"
]
# AMD/ROCm: JAX with ROCm GPU support. The `jax[rocm]` extra requires installing the
# ROCm PJRT plugin wheel (jax-rocm*-plugin / jax-rocm*-pjrt) from AMD's index, e.g.:
#     pip install -e .[rocm] \
#         --extra-index-url https://repo.radeon.com/rocm/manylinux/rocm-rel-7.0/
# Use the index that matches your installed ROCm version.
rocm = [
    "jax[rocm]"
]

[project.scripts]
mjwarp-testspeed = "mujoco_warp.testspeed:main"
mjwarp-viewer = "mujoco_warp.viewer:main"
mjwarp-record = "mujoco_warp.record:main"


[project.urls]
Homepage = "https://github.com/google-deepmind/mujoco_warp"
Documentation = "https://mujoco.readthedocs.io"
Repository = "https://github.com/google-deepmind/mujoco_warp"
Changelog = "https://mujoco.readthedocs.io/en/stable/changelog.html"

[tool.ruff]
line-length = 128
indent-width = 2
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "D",  # pydocstyle conventions and style
    "I",  # isort
    "W",  # pycodestyle
    "F401",  # unused imports
]

ignore = [
    "D100",  # missing docstring public module
    "D103",  # missing docstring public function
]

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 128

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"contrib/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
testpaths = ["mujoco_warp"]
norecursedirs = ["benchmarks", "contrib"]

[tool.setuptools]
package-data = { "mujoco_warp" = ["test_data/**"] }

[tool.setuptools.packages.find]
include = ["mujoco_warp*"]
